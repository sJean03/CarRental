        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login

  schemas:
    # ==================== USER SCHEMAS ====================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        email:
          type: string
          format: email
          example: "juan.delacruz@example.com"
        first_name:
          type: string
          example: "Juan"
        last_name:
          type: string
          example: "Dela Cruz"
        phone_number:
          type: string
          example: "+639171234567"
        date_of_birth:
          type: string
          format: date
          example: "1990-01-15"
        driver_license_number:
          type: string
          example: "N01-12-345678"
        driver_license_expiry:
          type: string
          format: date
          example: "2027-12-31"
        role:
          type: string
          enum: [customer, owner, admin]
          example: "customer"
        is_verified:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
        profile_photo_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VehicleOwner:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        business_name:
          type: string
          nullable: true
        tax_id:
          type: string
          nullable: true
        bank_account_number:
          type: string
          nullable: true
        bank_name:
          type: string
          nullable: true
        preferred_payout_method:
          type: string
          enum: [credit_card, debit_card]
        total_earnings:
          type: number
          format: float
          example: 125000.00
        total_rentals:
          type: integer
          example: 45
        average_rating:
          type: number
          format: float
          example: 4.8
        response_rate:
          type: number
          format: float
          example: 98.5
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ==================== CAR SCHEMAS ====================
    Car:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        make:
          type: string
          example: "Toyota"
        model:
          type: string
          example: "Vios"
        year:
          type: integer
          example: 2022
        color:
          type: string
          example: "White"
        license_plate:
          type: string
          example: "ABC-1234"
        vin:
          type: string
          nullable: true
        category_id:
          type: string
          format: uuid
        category_name:
          type: string
          example: "Sedan"
        transmission:
          type: string
          enum: [automatic, manual]
          example: "automatic"
        fuel_type:
          type: string
          enum: [petrol, diesel, electric, hybrid]
          example: "petrol"
        seating_capacity:
          type: integer
          example: 5
        daily_rate:
          type: number
          format: float
          example: 1500.00
        description:
          type: string
          example: "Fuel-efficient sedan perfect for city driving"
        features:
          type: array
          items:
            type: string
          example: ["GPS", "Bluetooth", "Backup Camera"]
        rules:
          type: string
          nullable: true
        image_urls:
          type: array
          items:
            type: string
            format: uri
        home_branch_id:
          type: string
          format: uuid
          nullable: true
        branch_name:
          type: string
          example: "Manila Branch"
        branch_city:
          type: string
          example: "Manila"
        storage_option:
          type: string
          enum: [warehouse, owner_delivers]
          example: "owner_delivers"
        status:
          type: string
          enum: [pending_approval, approved, listed, unavailable, suspended]
          example: "listed"
        admin_notes:
          type: string
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        total_bookings:
          type: integer
          example: 23
        average_rating:
          type: number
          format: float
          example: 4.7
        owner_first_name:
          type: string
          example: "Maria"
        owner_last_name:
          type: string
          example: "Santos"
        owner_rating:
          type: number
          format: float
          example: 4.8
        owner_response_rate:
          type: number
          format: float
          example: 95.0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CarCreate:
      type: object
      required:
        - make
        - model
        - year
        - license_plate
        - category_id
        - transmission
        - fuel_type
        - seating_capacity
        - daily_rate
      properties:
        make:
          type: string
          example: "Toyota"
        model:
          type: string
          example: "Vios"
        year:
          type: integer
          minimum: 1900
          example: 2022
        color:
          type: string
          example: "White"
        license_plate:
          type: string
          example: "ABC-1234"
        vin:
          type: string
        category_id:
          type: string
          format: uuid
        transmission:
          type: string
          enum: [automatic, manual]
          example: "automatic"
        fuel_type:
          type: string
          enum: [petrol, diesel, electric, hybrid]
          example: "petrol"
        seating_capacity:
          type: integer
          minimum: 1
          maximum: 20
          example: 5
        daily_rate:
          type: number
          format: float
          minimum: 0
          example: 1500.00
        description:
          type: string
        features:
          type: array
          items:
            type: string
          example: ["GPS", "Bluetooth"]
        rules:
          type: string
        image_urls:
          type: array
          items:
            type: string
            format: uri
        home_branch_id:
          type: string
          format: uuid
        storage_option:
          type: string
          enum: [warehouse, owner_delivers]
          default: owner_delivers

    CarUpdate:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        license_plate:
          type: string
        vin:
          type: string
        transmission:
          type: string
          enum: [automatic, manual]
        fuel_type:
          type: string
          enum: [petrol, diesel, electric, hybrid]
        seating_capacity:
          type: integer
        daily_rate:
          type: number
          format: float
        description:
          type: string
        features:
          type: array
          items:
            type: string
        rules:
          type: string
        image_urls:
          type: array
          items:
            type: string
        storage_option:
          type: string
          enum: [warehouse, owner_delivers]

    # ==================== BOOKING SCHEMAS ====================
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        booking_reference:
          type: string
          example: "RE-20251101-ABC123"
        customer_id:
          type: string
          format: uuid
        car_id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        pickup_date:
          type: string
          format: date
          example: "2025-11-01"
        return_date:
          type: string
          format: date
          example: "2025-11-05"
        total_days:
          type: integer
          example: 5
        branch_id:
          type: string
          format: uuid
        daily_rate:
          type: number
          format: float
          example: 1500.00
        subtotal:
          type: number
          format: float
          example: 7500.00
        platform_fee:
          type: number
          format: float
          example: 750.00
        total_amount:
          type: number
          format: float
          example: 8250.00
        payment_plan:
          type: string
          enum: [full, installment]
          example: "full"
        installment_months:
          type: integer
          nullable: true
        monthly_payment:
          type: number
          format: float
          nullable: true
        status:
          type: string
          enum: [pending_payment, payment_confirmed, pending_owner_confirmation, confirmed, awaiting_vehicle_dropoff, ready_for_pickup, active, awaiting_return, returned, completed, cancelled, cancelled_with_refund]
          example: "confirmed"
        owner_dropoff_at:
          type: string
          format: date-time
          nullable: true
        customer_pickup_at:
          type: string
          format: date-time
          nullable: true
        customer_return_at:
          type: string
          format: date-time
          nullable: true
        owner_pickup_at:
          type: string
          format: date-time
          nullable: true
        actual_return_date:
          type: string
          format: date
          nullable: true
        days_late:
          type: integer
          example: 0
        late_fee:
          type: number
          format: float
          example: 0
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          nullable: true
        refund_amount:
          type: number
          format: float
          example: 0
        customer_notes:
          type: string
          nullable: true
        admin_notes:
          type: string
          nullable: true
        make:
          type: string
          example: "Toyota"
        model:
          type: string
          example: "Vios"
        year:
          type: integer
          example: 2022
        license_plate:
          type: string
          example: "ABC-1234"
        car_images:
          type: array
          items:
            type: string
        customer_first_name:
          type: string
          example: "Juan"
        customer_last_name:
          type: string
          example: "Dela Cruz"
        customer_email:
          type: string
          example: "juan@example.com"
        customer_phone:
          type: string
          example: "+639171234567"
        owner_first_name:
          type: string
          example: "Maria"
        owner_last_name:
          type: string
          example: "Santos"
        owner_email:
          type: string
          example: "maria@example.com"
        owner_phone:
          type: string
          example: "+639181234567"
        branch_name:
          type: string
          example: "Manila Branch"
        branch_address:
          type: string
          example: "123 Rizal Avenue, Ermita"
        branch_city:
          type: string
          example: "Manila"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BookingCreate:
      type: object
      required:
        - car_id
        - pickup_date
        - return_date
      properties:
        car_id:
          type: string
          format: uuid
        pickup_date:
          type: string
          format: date
          example: "2025-11-01"
        return_date:
          type: string
          format: date
          example: "2025-11-05"
        branch_id:
          type: string
          format: uuid
          description: Optional, defaults to car's home branch
        payment_plan:
          type: string
          enum: [full, installment]
          default: full
          example: "full"
        installment_months:
          type: integer
          minimum: 1
          maximum: 12
          description: Required if payment_plan is installment
        customer_notes:
          type: string
          example: "I'll arrive at 2 PM"

    # ==================== PAYMENT SCHEMAS ====================
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        booking_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
          example: 8250.00
        payment_method:
          type: string
          enum: [credit_card, debit_card]
          example: "credit_card"
        payment_plan:
          type: string
          enum: [full, installment]
          example: "full"
        installment_number:
          type: integer
          nullable: true
        is_initial_payment:
          type: boolean
          example: true
        card_last4:
          type: string
          example: "1234"
        card_brand:
          type: string
          example: "Visa"
        transaction_id:
          type: string
          example: "TXN-1698765432-A1B2C3D4"
        status:
          type: string
          enum: [pending, processing, completed, failed, refunded]
          example: "completed"
        processed_at:
          type: string
          format: date-time
          nullable: true
        refunded_amount:
          type: number
          format: float
          example: 0
        refunded_at:
          type: string
          format: date-time
          nullable: true
        refund_reason:
          type: string
          nullable: true
        booking_reference:
          type: string
          example: "RE-20251101-ABC123"
        customer_email:
          type: string
          example: "juan@example.com"
        created_at:
          type: string
          format: date-time

    # ==================== ERROR SCHEMAS ====================
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"

    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "Invalid email format"

  responses:
    UnauthorizedError:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "No token provided. Authorization denied."

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Access denied. Required role: owner"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'