openapi: 3.0.3
info:
  title: RentEase Marketplace API
  description: |
    RentEase is a Turo-style P2P car rental marketplace platform for the Philippines.
    
    ## Authentication
    Most endpoints require JWT authentication. Include the token in the Authorization header:
    ```
    Authorization: Bearer <your_jwt_token>
    ```
    
    ## Base URL
    Development: `http://localhost:5000/api`
    
    ## Features
    - User authentication (Customer, Owner, Admin roles)
    - Car listing management
    - Booking/reservation system
    - Payment processing (mock implementation)
    - Owner dashboard and earnings
    - Admin approval workflow
    
  version: 1.0.0
  contact:
    name: RentEase Support
    email: support@rentease.ph

servers:
  - url: http://localhost:5000/api
    description: Development server
  - url: https://api.rentease.ph/api
    description: Production server

tags:
  - name: Authentication
    description: User registration, login, and profile management
  - name: Cars
    description: Car listing operations (CRUD, search, availability)
  - name: Bookings
    description: Booking/reservation management
  - name: Payments
    description: Payment processing and management
  - name: Health
    description: API health check

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: API Health Check
      description: Check if the API is running
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "RentEase API is running"
                  timestamp:
                    type: string
                    format: date-time
                  environment:
                    type: string
                    example: "development"

  # ==================== AUTHENTICATION ENDPOINTS ====================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account (customer or owner)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - first_name
                - last_name
              properties:
                email:
                  type: string
                  format: email
                  example: "juan.delacruz@example.com"
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: "SecurePass123!"
                first_name:
                  type: string
                  example: "Juan"
                last_name:
                  type: string
                  example: "Dela Cruz"
                phone_number:
                  type: string
                  example: "+639171234567"
                date_of_birth:
                  type: string
                  format: date
                  example: "1990-01-15"
                role:
                  type: string
                  enum: [customer, owner]
                  default: customer
                  example: "customer"
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Registration successful"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "juan.delacruz@example.com"
                password:
                  type: string
                  format: password
                  example: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      ownerProfile:
                        $ref: '#/components/schemas/VehicleOwner'
                        nullable: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update current user's profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Juan"
                last_name:
                  type: string
                  example: "Dela Cruz"
                phone_number:
                  type: string
                  example: "+639171234567"
                date_of_birth:
                  type: string
                  format: date
                  example: "1990-01-15"
                driver_license_number:
                  type: string
                  example: "N01-12-345678"
                driver_license_expiry:
                  type: string
                  format: date
                  example: "2027-12-31"
                profile_photo_url:
                  type: string
                  format: uri
                  example: "https://example.com/photos/profile.jpg"
                drivers_license_photo_url:
                  type: string
                  format: uri
                  example: "https://example.com/photos/license.jpg"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile updated successfully"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: No valid fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/change-password:
    put:
      tags:
        - Authentication
      summary: Change password
      description: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: "OldPass123!"
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  example: "NewSecurePass456!"
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password changed successfully"
        '401':
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Logout current user (client should delete token)
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully"

  # ==================== CAR ENDPOINTS ====================
  /cars:
    get:
      tags:
        - Cars
      summary: Get all cars
      description: Retrieve all car listings with optional filters
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_approval, approved, listed, unavailable, suspended]
          description: Filter by car status (default: listed)
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by vehicle category
        - name: transmission
          in: query
          schema:
            type: string
            enum: [automatic, manual]
          description: Filter by transmission type
        - name: fuel_type
          in: query
          schema:
            type: string
            enum: [petrol, diesel, electric, hybrid]
          description: Filter by fuel type
        - name: min_seats
          in: query
          schema:
            type: integer
            minimum: 1
          description: Minimum seating capacity
        - name: min_price
          in: query
          schema:
            type: number
            format: float
          description: Minimum daily rate
        - name: max_price
          in: query
          schema:
            type: number
            format: float
          description: Maximum daily rate
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by home branch/location
        - name: search
          in: query
          schema:
            type: string
          description: Search by make or model
        - name: sort_by
          in: query
          schema:
            type: string
            default: created_at
            enum: [created_at, daily_rate, average_rating]
          description: Sort field
        - name: sort_order
          in: query
          schema:
            type: string
            default: DESC
            enum: [ASC, DESC]
          description: Sort order
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of results per page
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Pagination offset
      responses:
        '200':
          description: Cars retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 15
                  data:
                    type: object
                    properties:
                      cars:
                        type: array
                        items:
                          $ref: '#/components/schemas/Car'

    post:
      tags:
        - Cars
      summary: Create car listing
      description: Create a new car listing (Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarCreate'
      responses:
        '201':
          description: Car listing created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Car listing created successfully. Awaiting admin approval."
                  data:
                    type: object
                    properties:
                      car:
                        $ref: '#/components/schemas/Car'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /cars/my-cars:
    get:
      tags:
        - Cars
      summary: Get my cars
      description: Get current owner's car listings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_approval, approved, listed, unavailable, suspended]
          description: Filter by car status
      responses:
        '200':
          description: Cars retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 5
                  data:
                    type: object
                    properties:
                      cars:
                        type: array
                        items:
                          $ref: '#/components/schemas/Car'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /cars/{id}:
    get:
      tags:
        - Cars
      summary: Get car by ID
      description: Retrieve detailed information about a specific car
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      responses:
        '200':
          description: Car retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      car:
                        $ref: '#/components/schemas/Car'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Cars
      summary: Update car listing
      description: Update car details (Owner only, must own the car)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarUpdate'
      responses:
        '200':
          description: Car updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Car updated successfully"
                  data:
                    type: object
                    properties:
                      car:
                        $ref: '#/components/schemas/Car'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Cars
      summary: Delete car listing
      description: Delete a car listing (Owner only, no active bookings)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      responses:
        '200':
          description: Car deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Car deleted successfully"
        '400':
          description: Cannot delete car with active bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cars/{id}/availability:
    get:
      tags:
        - Cars
      summary: Check car availability
      description: Check if a car is available for specific dates
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
        - name: pickup_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Pickup date (YYYY-MM-DD)
        - name: return_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Return date (YYYY-MM-DD)
      responses:
        '200':
          description: Availability check completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      available:
                        type: boolean
                        example: true
                      pickup_date:
                        type: string
                        format: date
                        example: "2025-11-01"
                      return_date:
                        type: string
                        format: date
                        example: "2025-11-05"
        '400':
          description: Missing required query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cars/{id}/blocked-dates:
    get:
      tags:
        - Cars
      summary: Get blocked dates
      description: Get all blocked date ranges for a car
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      responses:
        '200':
          description: Blocked dates retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      blockedDates:
                        type: array
                        items:
                          type: object
                          properties:
                            blocked_from:
                              type: string
                              format: date
                              example: "2025-11-15"
                            blocked_until:
                              type: string
                              format: date
                              example: "2025-11-20"
                            reason:
                              type: string
                              example: "Personal use"

  /cars/{id}/block-dates:
    post:
      tags:
        - Cars
      summary: Block dates for car
      description: Block specific date ranges to prevent bookings (Owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - blocked_from
                - blocked_until
              properties:
                blocked_from:
                  type: string
                  format: date
                  example: "2025-11-15"
                blocked_until:
                  type: string
                  format: date
                  example: "2025-11-20"
                reason:
                  type: string
                  example: "Maintenance"
      responses:
        '201':
          description: Dates blocked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Dates blocked successfully"
                  data:
                    type: object
                    properties:
                      blocked:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          car_id:
                            type: string
                            format: uuid
                          blocked_from:
                            type: string
                            format: date
                          blocked_until:
                            type: string
                            format: date
                          reason:
                            type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cars/{id}/approve:
    put:
      tags:
        - Cars
      summary: Approve car listing
      description: Approve a pending car listing (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_notes:
                  type: string
                  example: "All documents verified"
      responses:
        '200':
          description: Car approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Car approved successfully"
                  data:
                    type: object
                    properties:
                      car:
                        $ref: '#/components/schemas/Car'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cars/{id}/reject:
    put:
      tags:
        - Cars
      summary: Reject car listing
      description: Reject a pending car listing (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Car ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejection_reason
              properties:
                rejection_reason:
                  type: string
                  example: "Incomplete vehicle documentation"
                admin_notes:
                  type: string
                  example: "Need updated registration"
      responses:
        '200':
          description: Car rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Car rejected"
                  data:
                    type: object
                    properties:
                      car:
                        $ref: '#/components/schemas/Car'
        '400':
          description: Rejection reason required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== BOOKING ENDPOINTS ====================
  /bookings:
    post:
      tags:
        - Bookings
      summary: Create booking
      description: Create a new booking/reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Booking created successfully. Please proceed with payment."
                  data:
                    type: object
                    properties:
                      booking:
                        $ref: '#/components/schemas/Booking'
        '400':
          description: Validation error or car not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Car not available for selected dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/my-bookings:
    get:
      tags:
        - Bookings
      summary: Get my bookings
      description: Get current user's bookings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_payment, payment_confirmed, pending_owner_confirmation, confirmed, awaiting_vehicle_dropoff, ready_for_pickup, active, awaiting_return, returned, completed, cancelled, cancelled_with_refund]
          description: Filter by booking status
      responses:
        '200':
          description: Bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 3
                  data:
                    type: object
                    properties:
                      bookings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /bookings/owner-bookings:
    get:
      tags:
        - Bookings
      summary: Get owner bookings
      description: Get bookings for current owner's cars
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter by booking status
      responses:
        '200':
          description: Bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 8
                  data:
                    type: object
                    properties:
                      bookings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Owner profile not found
          content:
            application/json:
              schema:
