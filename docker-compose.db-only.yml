services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rentease-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentease
      POSTGRES_PASSWORD: rentease123
      POSTGRES_DB: rentease_ph
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rentease-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentease"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for sessions and GPS tracking cache)
  redis:
    image: redis:7-alpine
    container_name: rentease-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rentease-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (placeholder - we'll build this next)
