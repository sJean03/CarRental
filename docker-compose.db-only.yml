  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #   networks:
  #     - rentease-network

  # Frontend (placeholder - we'll build this next)
  # frontend:
  #   build: ./frontend
  #   container_name: rentease-frontend
  #   restart: unless-stopped
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:5000
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend
  #   volumes:
  #     - ./frontend:/app
